[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["The Tack contributors"]
publish = false

[workspace.dependencies]
tack-core = { path = "crates/tack-core" }
tack-windows = { path = "crates/tack-windows" }

base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
httparse = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-build = "2.7.1"
# No `zip` feature: Tack's updates are bare installers, not v1 zip archives.
tauri-plugin-updater = { version = "2.13.2", default-features = false, features = ["native-tls", "system-proxy"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
trash = "5.2.9"
# The same version Tauri's WebView2 backend (wry) uses, so its types match.
webview2-com = "0.39.1"
windows = "0.62"
# The `implement` macro names it directly.
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image decoding is unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
