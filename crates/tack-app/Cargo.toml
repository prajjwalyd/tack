[package]
name = "tack-app"
description = "A corkboard for your screenshots that slides down from the top of the screen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "tack"

# The executable keeps the product's name: tack.exe.
[[bin]]
name = "tack"
path = "src/main.rs"

[dependencies]
tack-core.workspace = true
tack-windows.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
webview2-com.workspace = true

[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading"]

[build-dependencies]
tauri-build.workspace = true
