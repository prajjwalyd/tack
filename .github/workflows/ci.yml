name: CI

# A tag push is built by the release workflow, so it isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Tauri CLI
        run: npm ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (release, where debug-only code is compiled out)
        run: cargo clippy --workspace --release -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: npx tauri build --no-bundle
