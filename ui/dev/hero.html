<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The README's hero and feature images are rendered from this page
       (see docs/design.md, "README images"): the real board, styles and
       scripts, with the preview's fake backend, over a made-up desktop: an
       abstract wallpaper drawn here in CSS and a Windows 11-like taskbar
       (taskbar.js, taskbar.css, desktop/).
       ?theme=light|dark picks the desktop and the board together; the fake
       backend's ?n= and ?kept= set the prints. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tack hero</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/board.css">
  <link rel="stylesheet" href="../styles/print.css">
  <link rel="stylesheet" href="../styles/pin.css">
  <link rel="stylesheet" href="../styles/note.css">
  <link rel="stylesheet" href="../styles/hint.css">
  <link rel="stylesheet" href="../styles/cues.css">
  <link rel="stylesheet" href="../styles/motion.css">
  <link rel="stylesheet" href="../styles/flight.css">
  <link rel="stylesheet" href="../styles/a11y.css">
  <link rel="stylesheet" href="hero.css">
  <link rel="stylesheet" href="taskbar.css">
</head>
<body>
  <div id="wallpaper" aria-hidden="true">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <svg class="ribbons" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" class="r1a"/><stop offset=".55" class="r1b"/><stop offset="1" class="r1c"/>
        </linearGradient>
        <linearGradient id="r2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" class="r2a"/><stop offset="1" class="r2b"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
        <filter id="softer" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
      </defs>
      <path filter="url(#softer)" fill="url(#r2)" d="M-100 760 C 260 540, 620 820, 980 600 S 1560 420, 1760 520 L 1760 980 L -100 980 Z"/>
      <path filter="url(#soft)" fill="url(#r1)" opacity=".9" d="M-120 640 C 220 470, 560 700, 900 520 S 1450 300, 1740 380 L 1740 470 C 1450 400, 1180 600, 900 640 S 300 640, -120 760 Z"/>
      <path filter="url(#soft)" fill="url(#r1)" opacity=".45" d="M-120 520 C 300 380, 640 560, 1000 430 S 1500 250, 1740 300 L 1740 330 C 1500 300, 1200 470, 980 500 S 320 470, -120 580 Z"/>
    </svg>
  </div>

  <!-- Same markup as ../index.html. -->
  <div id="board" class="tucked gone" role="listbox" aria-orientation="horizontal" aria-label="Tack board" tabindex="-1">
    <div class="cork" aria-hidden="true"></div>
    <div id="rail" role="none"><div id="prints" role="none"></div></div>
    <div id="hint" class="hint-card" aria-hidden="true">
      <span class="pin" data-c="sage"><span class="pin-head"></span></span>
      <p>Take a screenshot<span class="dot">&middot;</span><span class="keys">Win + Shift + S</span></p>
    </div>
  </div>

  <div id="taskbar" class="taskbar" aria-hidden="true"
       data-apps="folder browser mail chat code music" data-running="folder chat" data-active="browser"></div>

  <script type="module" src="hero.js"></script>
  <script type="module" src="taskbar.js"></script>
  <script type="module" src="fake-ipc.js"></script>
  <script type="module" src="../scripts/main.js"></script>
</body>
</html>
