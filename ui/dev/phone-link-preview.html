<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The phone window in a plain browser, with phone-link-fake.js standing
       in for the backend (see its header for ?state=, ?theme= and ?ask=).
       Size the browser window to about 420 x 600 to see it as the app shows
       it. Same CSP as the app. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tack on your phone</title>
  <link rel="stylesheet" href="../styles/phone-link.css">
  <style>
    /* Preview only: "closed" greys the window out, as it would go. */
    html.closed body { opacity: .35; pointer-events: none; transition: opacity 200ms ease; }
  </style>
</head>
<body>
  <script type="module" src="phone-link-fake.js"></script>
  <script type="module" src="../scripts/phone-link.js"></script>
</body>
</html>
