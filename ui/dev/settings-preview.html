<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The Settings window in a plain browser, with settings-fake.js standing
       in for the backend (see its header for ?updates=, ?theme=, ?felt= and
       ?frame=). Size the browser window to 520 x 640 to see it as the app
       shows it. Same CSP as the app. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tack settings</title>
  <link rel="stylesheet" href="../styles/dialog.css">
  <link rel="stylesheet" href="../styles/switch.css">
  <link rel="stylesheet" href="../styles/settings.css">
  <link rel="stylesheet" href="../styles/phone.css">
  <style>
    /* Preview only: "closed" greys the window out, as it would go. */
    html.closed body { opacity: .35; pointer-events: none; transition: opacity 200ms ease; }
    /* Preview only: the panel sits to the right of the window, so only wide browsers show it. */
    #harness {
      position: fixed; top: 12px; right: 12px; display: none; flex-direction: column; gap: 8px;
      width: 200px; padding: 12px; border-radius: 8px;
      background: var(--card); box-shadow: 0 0 0 1px var(--card-edge); font: 12px/16px var(--font-small);
    }
    #harness h2 { margin: 0; font-size: 12px; }
    #harness label { display: grid; gap: 2px; }
    @media (min-width: 900px) { #harness { display: flex; } }
  </style>
</head>
<body>
  <script type="module" src="settings-fake.js"></script>
  <script type="module" src="../scripts/settings/main.js"></script>
</body>
</html>
