<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The app's own CSP (crates/tack-app/tauri.conf.json), so the preview
       catches anything the real webview would block. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Tack preview</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/board.css">
  <link rel="stylesheet" href="../styles/print.css">
  <link rel="stylesheet" href="../styles/pin.css">
  <link rel="stylesheet" href="../styles/note.css">
  <link rel="stylesheet" href="../styles/motion.css">
  <style>
    /* Dev harness only: a desktop wallpaper behind the transparent board. */
    html, body { cursor: auto; }
    body {
      background:
        radial-gradient(60% 80% at 20% 30%, rgba(120, 170, 255, .55), transparent 70%),
        radial-gradient(50% 70% at 80% 20%, rgba(190, 120, 255, .45), transparent 70%),
        radial-gradient(70% 70% at 60% 90%, rgba(60, 200, 220, .40), transparent 70%),
        linear-gradient(160deg, #1d3a73, #3d2a6e 55%, #10223f) !important;
    }
    body.light {
      background:
        radial-gradient(60% 80% at 20% 30%, rgba(255, 255, 255, .8), transparent 70%),
        radial-gradient(50% 70% at 80% 20%, rgba(200, 220, 255, .9), transparent 70%),
        linear-gradient(160deg, #cfe0f7, #e8dff5 55%, #f4f6fb) !important;
    }
    #win {
      position: fixed; left: 0; top: 0; right: 0; height: 396px;
      outline: 1px dashed rgba(255, 255, 255, .28); outline-offset: -1px;
      pointer-events: none; z-index: -1;
    }
    #win span, #rect span {
      position: absolute; right: 6px; bottom: 4px;
      font: 11px/1 "Segoe UI", system-ui, sans-serif; color: rgba(255, 255, 255, .6);
    }
    body.light #win { outline-color: rgba(0, 0, 0, .25); }
    body.light #win span { color: rgba(0, 0, 0, .5); }
    #rect {
      position: fixed; top: 0; pointer-events: none; z-index: 100;
      outline: 1px dashed rgba(255, 90, 90, .8); outline-offset: -1px; display: none;
    }
    body.show-rect #rect { display: block; }
    #rect span { color: rgba(255, 140, 140, .95); bottom: -16px; right: 0; }
    #controls {
      position: fixed; left: 50%; bottom: 20px; translate: -50% 0;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      max-width: calc(100vw - 40px);
      padding: 8px; border-radius: 12px;
      background: rgba(20, 22, 30, .72); backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
      font: 12px "Segoe UI", system-ui, sans-serif; z-index: 200;
    }
    #controls button {
      font: inherit; color: #eef; background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .14); border-radius: 7px;
      padding: 6px 10px; cursor: pointer;
    }
    #controls button:hover { background: rgba(255, 255, 255, .2); }
    #controls button.on { background: rgba(120, 200, 255, .35); }
    #log {
      position: fixed; left: 20px; bottom: 80px; width: 340px; max-height: 40vh; overflow: hidden;
      display: flex; flex-direction: column-reverse; gap: 3px;
      font: 11px/1.35 Consolas, "Cascadia Mono", monospace; color: rgba(255, 255, 255, .85);
      pointer-events: none; z-index: 150;
    }
    #log div { background: rgba(0, 0, 0, .35); padding: 2px 6px; border-radius: 4px; align-self: flex-start; }
    body.light #log div { background: rgba(255, 255, 255, .7); color: #222; }
  </style>
</head>
<body>
  <div id="win"><span>window: full width × 396 (176 strip + 220 overhang)</span></div>
  <div id="rect"><span></span></div>

  <!-- Same markup as ../index.html. -->
  <div id="board" class="tucked gone" aria-label="Pinned screenshots">
    <div class="cork"></div>
    <div id="rail"><div id="prints"></div></div>
    <div id="hint" class="note">
      <span class="pin" data-c="sage"><span class="pin-head"></span></span>
      <p>Take a screenshot<span class="dot">&middot;</span><span class="keys">Win + Shift + S</span></p>
    </div>
  </div>

  <div id="log"></div>
  <div id="controls">
    <button data-action="reveal">Reveal</button>
    <button data-action="tuck">Tuck</button>
    <button data-action="add">Add</button>
    <button data-action="addQuiet">Add (quiet)</button>
    <button data-action="fill">Fill to 20</button>
    <button data-action="keep">Keep</button>
    <button data-action="shuffle">Shuffle (order-changed)</button>
    <button data-action="fall">Remove (fall)</button>
    <button data-action="quiet">Remove (quiet)</button>
    <button data-action="copied">Copied</button>
    <button data-action="gust">Breeze</button>
    <button data-action="drag">Drag</button>
    <button data-action="update">Update</button>
    <button data-action="pointerLeft">Pointer left</button>
    <button data-action="clear">Clear</button>
    <button data-toggle="sound" class="on">Sound</button>
    <button data-toggle="theme">Theme: system</button>
    <button data-toggle="light">Light wallpaper</button>
    <button data-toggle="show-rect">Show rect</button>
  </div>

  <!-- The fake backend first: it installs window.__TAURI__ before the board boots. -->
  <script type="module" src="fake-ipc.js"></script>
  <script type="module" src="../scripts/main.js"></script>
</body>
</html>
