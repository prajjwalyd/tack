<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The board on a phone, served by Tack itself over NetBird
       (crates/tack-app/src/phone/server.rs). No build step, no third-party code.
       Everything inside <main> is drawn by phone.js; the CSP allows no
       inline script or style. -->
  <meta name="theme-color" content="#1c4234">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tack">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/phone.css">
  <title>Tack</title>
</head>
<body data-link="loading">
  <header class="top">
    <div class="brand">
      <img class="logo" src="/icon.png" alt="" width="36" height="36">
      <div>
        <h1>Tack</h1>
        <p id="where">on your PC</p>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite">Connecting…</p>
  </header>

  <main>
    <!-- One-time tip; hidden once dismissed or once the page runs from the home screen. -->
    <section id="tip" class="card tip" aria-labelledby="tip-title" hidden>
      <span class="pin p2" aria-hidden="true"></span>
      <h2 id="tip-title">Add Tack to your home screen</h2>
      <p id="tip-how">iPhone: Share, then Add to Home Screen<br>Android: ⋮ menu, then Add to Home screen</p>
      <button id="tip-close" class="btn quiet" type="button">Dismiss</button>
    </section>

    <!-- Loading, waiting, denied, unreachable and empty: one calm card. -->
    <section id="state" class="card" aria-live="polite" hidden></section>

    <ul id="board" aria-label="Pinned on the board" hidden></ul>
  </main>

  <nav id="bar" class="bar" aria-label="Pin something" hidden>
    <button id="photo-btn" class="btn brass" type="button">Pin photo</button>
    <button id="write-btn" class="btn" type="button">Pin text</button>
    <input id="photo" type="file" accept="image/*" hidden>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- At the top of the screen, buttons first: the keyboard never covers them. -->
  <dialog id="text-sheet" aria-labelledby="text-title">
    <div class="row">
      <button id="text-cancel" class="btn plain" type="button">Cancel</button>
      <h2 id="text-title">Pin text</h2>
      <button id="text-pin" class="btn felt" type="button" disabled>Pin</button>
    </div>
    <textarea id="text" rows="5" maxlength="16000" aria-label="Text to pin" placeholder="A note or a link"></textarea>
  </dialog>

  <dialog id="viewer" aria-label="Screenshot">
    <div class="viewer-top">
      <button id="viewer-close" class="btn close" type="button" autofocus>Close</button>
    </div>
    <img id="full" alt="Pinned screenshot">
    <p class="hint">Press and hold to save or share</p>
  </dialog>

  <script src="/phone.js"></script>
</body>
</html>
